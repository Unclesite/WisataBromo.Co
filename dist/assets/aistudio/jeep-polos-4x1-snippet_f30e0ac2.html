<style>
html,body{ margin:0; padding:0; overflow:hidden; background:transparent; }
.jeep-scene{
  --drive: 35s;               /* waktu 1x lintasan; makin besar = makin pelan */
  position:relative; width:100%; aspect-ratio:1600/400; overflow:hidden;
  container-type:inline-size; background:transparent;
}
.jeep{
  position:absolute; left:0; width:26.0cqw;
  animation: jeep-travel var(--drive) linear infinite;
}
.jeep-body{ display:block; width:100%; height:auto; animation: jeep-bob 1.5s ease-in-out infinite alternate; }
.jeep-wheel{
  position:absolute; height:auto; aspect-ratio:1;
  animation: jeep-spin calc(var(--drive) / 7.3) linear infinite;  /* sinkron dengan laju maju */
}
@keyframes jeep-travel{ from{ transform:translateX(102cqw); } to{ transform:translateX(-30.0cqw); } }
@keyframes jeep-spin{ to{ transform:rotate(-360deg); } }
@keyframes jeep-bob{ from{ transform:translateY(0); } to{ transform:translateY(-.5%); } }
@media (prefers-reduced-motion: reduce){
  .jeep,.jeep-wheel,.jeep-body{ animation:none; }
  .jeep{ transform:translateX(37cqw); }
}
</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1280" width="1920" height="1280" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFE23A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFE23A" stop-opacity="0"/>
    </linearGradient>

    <!-- bentuk pintu (koordinat lokal 0,0 - 245,224) -->
    <g id="door">
      <path d="M4,106 L69,25 Q94,4 134,4 L241,4 L241,220 L4,220 Z" fill="#000" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
      <path d="M37,104 L79,51 Q99,23 134,23 L222,23 L222,104 Z" fill="#fff"/>
      <line x1="150" y1="104" x2="184" y2="24" stroke="#000" stroke-width="8"/>
      <line x1="172" y1="104" x2="206" y2="24" stroke="#000" stroke-width="8"/>
      <rect x="177" y="128" width="38" height="11" rx="5.5" fill="#fff"/>
    </g>
</defs>

  <style>
    .t { transform-box: fill-box; }
    :root { --y: #FFD400; }

    /* getaran mesin */
    .car { animation: shake 0.16s linear infinite; }
    @keyframes shake {
      0%,100% { transform: translate(0,0); }
      25% { transform: translate(1.5px,-1.5px); }
      50% { transform: translate(-1px,1px); }
      75% { transform: translate(1px,1.5px); }
    }

    /* lampu menyala kuning */
    .lamp { fill:#111; animation: lampOn 10s linear infinite; }
    @keyframes lampOn {
      0%,4%   { fill:#111; filter:none; }
      6%      { fill:#FFF27A; filter: drop-shadow(0 0 30px #FFD400); }
      8%      { fill:#111; filter:none; }
      10%     { fill:#FFE23A; filter: drop-shadow(0 0 35px #FFD400); }
      20%     { fill:#FFF27A; filter: drop-shadow(0 0 55px #FFD400); }
      30%     { fill:#FFE23A; filter: drop-shadow(0 0 35px #FFD400); }
      40%     { fill:#FFF27A; filter: drop-shadow(0 0 55px #FFD400); }
      50%     { fill:#FFE23A; filter: drop-shadow(0 0 35px #FFD400); }
      60%     { fill:#FFF27A; filter: drop-shadow(0 0 55px #FFD400); }
      70%     { fill:#FFE23A; filter: drop-shadow(0 0 35px #FFD400); }
      80%     { fill:#FFF27A; filter: drop-shadow(0 0 55px #FFD400); }
      90%     { fill:#FFE23A; filter: drop-shadow(0 0 35px #FFD400); }
      100%    { fill:#FFE23A; filter: drop-shadow(0 0 35px #FFD400); }
    }
    .ray { stroke:#111; stroke-width:7; stroke-linecap:round; animation: rayOn 10s linear infinite; }
    @keyframes rayOn {
      0%,4% { stroke:#111; opacity:1; }
      6%    { stroke:#FFD400; opacity:1; }
      8%    { stroke:#111; opacity:1; }
      10%   { stroke:#FFD400; opacity:1; }
      15%   { opacity:.45; }
      20%   { opacity:1; }
      25%   { opacity:.45; }
      30%   { opacity:1; }
      35%   { opacity:.45; }
      40%   { opacity:1; }
      45%   { opacity:.45; }
      50%   { opacity:1; }
      55%   { opacity:.45; }
      60%   { opacity:1; }
      65%   { opacity:.45; }
      70%   { opacity:1; }
      75%   { opacity:.45; }
      80%   { opacity:1; }
      85%   { opacity:.45; }
      90%,100% { stroke:#FFD400; opacity:1; }
    }
    .beam { opacity:0; animation: beamOn 10s linear infinite; }
    @keyframes beamOn {
      0%,5%  { opacity:0; }
      6%     { opacity:.6; }
      8%     { opacity:0; }
      10%    { opacity:.7; }
      25%    { opacity:.95; }
      40%    { opacity:.7; }
      55%    { opacity:.95; }
      70%    { opacity:.7; }
      85%    { opacity:.95; }
      100%   { opacity:.7; }
    }


    /* pintu menutup lalu menghilang */
    .d1 { transform-origin: 50% 0%; animation: d1 10s ease-in-out infinite; }
    @keyframes d1 {
      0%,44%  { opacity:1; transform: translateY(0) scale(1,1); }
      52%     { opacity:1; transform: translateY(-34px) scale(.92,.96); }
      56%     { opacity:0; transform: translateY(-40px) scale(.9,.95); }
      94%     { opacity:0; transform: translateY(-40px) scale(.9,.95); }
      100%    { opacity:1; transform: translateY(0) scale(1,1); }
    }
    .d2 { transform-origin: 0% 50%; animation: d2 10s ease-in-out infinite; }
    @keyframes d2 {
      0%,44%  { opacity:1; transform: translateX(0) scale(1,1); }
      52%     { opacity:1; transform: translateX(-34px) scale(.96,.92); }
      56%     { opacity:0; transform: translateX(-40px) scale(.95,.9); }
      94%     { opacity:0; transform: translateX(-40px) scale(.95,.9); }
      100%    { opacity:1; transform: translateX(0) scale(1,1); }
    }
  </style>

  <!-- sinar lampu -->
  <polygon class="beam" points="262,427 0,290 0,565" fill="url(#beam)"/>
  <polygon class="beam" points="262,680 0,543 0,818" fill="url(#beam)"/>

  <!-- pintu (terbuka) -->
  <g transform="translate(666,894)"><g class="t d1"><use href="#door"/></g></g>
  <g transform="translate(1475,473)"><g class="t d2"><use href="#door"/></g></g>

  <!-- badan mobil -->
  <g class="car">
    <rect x="283" y="321" width="330" height="462" rx="100" fill="#209CEE"/>
    <rect x="547" y="241" width="893" height="622" rx="95" fill="#1294F0"/>
    <rect x="547" y="321" width="70" height="462" fill="#209CEE"/>

    <!-- lampu -->
    <g>
      <path class="lamp" d="M260,392 L282,392 Q322,402 322,427 Q322,452 282,462 L260,462 Z"/>
      <path class="lamp" d="M260,645 L282,645 Q322,655 322,680 Q322,705 282,715 L260,715 Z"/>
      <line class="ray" x1="201" y1="385" x2="248" y2="401"/>
      <line class="ray" x1="201" y1="413" x2="248" y2="418"/>
      <line class="ray" x1="201" y1="440" x2="248" y2="435"/>
      <line class="ray" x1="201" y1="468" x2="248" y2="452"/>
      <line class="ray" x1="201" y1="638" x2="248" y2="654"/>
      <line class="ray" x1="201" y1="666" x2="248" y2="671"/>
      <line class="ray" x1="201" y1="693" x2="248" y2="688"/>
      <line class="ray" x1="201" y1="721" x2="248" y2="705"/>
    </g>

    <!-- ikon pengemudi -->
    <circle cx="722" cy="378" r="46" fill="none" stroke="#000" stroke-width="20"/>
    <circle cx="722" cy="378" r="10" fill="#000"/>
    <ellipse cx="826" cy="378" rx="40" ry="35" fill="#000"/>

    <!-- kursi 1 -->
    <rect x="666" y="490" width="152" height="140" rx="32" fill="#000"/>
    <rect x="818" y="545" width="14" height="30" fill="#000"/>
    <rect x="828" y="521" width="42" height="78" rx="10" fill="#000"/>
    <text x="750" y="577" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="80" fill="#fff" text-anchor="middle">1</text>

    <!-- kursi 2 -->
    <rect x="662" y="666" width="152" height="140" rx="32" fill="#000"/>
    <rect x="814" y="721" width="14" height="30" fill="#000"/>
    <rect x="824" y="697" width="42" height="78" rx="10" fill="#000"/>
    <text x="746" y="753" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="80" fill="#fff" text-anchor="middle">2</text>

    <!-- panel 3 4 -->
    <rect x="939" y="305" width="392" height="139" fill="#000"/>
    <text x="1048" y="400" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="92" fill="#fff" text-anchor="middle">3</text>
    <text x="1222" y="400" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="92" fill="#fff" text-anchor="middle">4</text>

    <!-- panel 5 kamera -->
    <rect x="939" y="660" width="392" height="139" fill="#000"/>
    <text x="1048" y="763" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="92" fill="#fff" text-anchor="middle">5</text>
    <path d="M1172,716 Q1172,706 1182,706 L1200,706 L1208,692 L1236,692 L1244,706 L1262,706 Q1272,706 1272,716 L1272,756 Q1272,766 1262,766 L1182,766 Q1172,766 1172,756 Z" fill="#fff"/>
    <circle cx="1222" cy="735" r="19" fill="none" stroke="#000" stroke-width="7"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

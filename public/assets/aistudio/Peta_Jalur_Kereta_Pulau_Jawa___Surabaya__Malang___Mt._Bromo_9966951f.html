<style>
:root{--bg:#e0e0e0;--blue:#1e6fd9;--sky:#3aa0f0;--navy:#0b3d91;--green:#4f7a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
svg{width:100%;max-width:1274px;height:auto;display:block}
.land{fill:#ececec;stroke:#fff;stroke-width:4;stroke-linejoin:round}
.thin{fill:none;stroke-width:2.5;stroke-linecap:round}
.rail{fill:none;stroke-width:3.5;stroke-dasharray:12 8;animation:flow 1.6s linear infinite}
.rail.s{stroke:var(--blue)}.rail.m{stroke:var(--sky)}
.gr{fill:none;stroke:var(--green);stroke-width:3.5;stroke-dasharray:2 7;stroke-linecap:round;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-40}}
.ts{fill:#0b3d91}.tm{fill:#1565c0}
.lbl{font-weight:700;font-size:22px;fill:#000}
.pin{fill:var(--blue);transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.ring{fill:none;stroke:var(--blue);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite;opacity:0}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.bromo{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pulse{50%{transform:scale(1.15)}}
.lg{font-size:19px;fill:#222}.lh{font-size:23px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

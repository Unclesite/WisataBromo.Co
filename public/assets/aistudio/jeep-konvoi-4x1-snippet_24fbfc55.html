      s.globalAlpha = .07; s.fillStyle = '#000';               // tekstur tenun
      for (var y=0; y<ch; y+=3*dpr) s.fillRect(0,y,L,dpr);
      for (var x=0; x<L; x+=3*dpr) s.fillRect(x,0,dpr,ch);
      s.globalAlpha = 1;
      s.fillStyle = 'rgba(0,0,0,.22)'; s.fillRect(0,0,sleeve,ch);   // sarung tiang kiri
      s.strokeStyle = 'rgba(255,255,255,.55)'; s.lineWidth = Math.max(1,dpr); // jahitan tepi
      s.setLineDash([6*dpr,4*dpr]);
      var m = ch*0.075;
      s.beginPath(); s.moveTo(sleeve,m); s.lineTo(L-n*0.55,m); s.moveTo(sleeve,ch-m); s.lineTo(L-n*0.55,ch-m); s.stroke();
      s.setLineDash([]);
      s.beginPath(); s.moveTo(sleeve,m); s.lineTo(sleeve,ch-m); s.stroke();
      [ch*.16, ch*.84].forEach(function(gy){                         // mata ayam / grommet
        s.fillStyle = '#c9ced3'; s.beginPath(); s.arc(sleeve/2, gy, ch*.055, 0, 7); s.fill();
        s.fillStyle = '#2a2d31'; s.beginPath(); s.arc(sleeve/2, gy, ch*.03, 0, 7); s.fill();
      });
      var cx = sleeve + (L - n - sleeve)/2, maxW = (L - n - sleeve) * 0.93;
      function fit(txt, px, wt){ var f = px;
        s.font = wt+' '+f+'px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
        while (s.measureText(txt).width > maxW && f > 8){ f -= 1; s.font = wt+' '+f+'px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif'; } }
      s.textAlign = 'center'; s.textBaseline = 'middle';
      s.shadowColor = 'rgba(0,0,0,.45)'; s.shadowBlur = ch*.03; s.shadowOffsetY = ch*.015;
      fit(L1, ch*.33, 800); s.fillStyle = '#ffd23f'; s.fillText(L1, cx, ch*.39);
      fit(L2, ch*.23, 600); s.fillStyle = '#ffffff'; s.fillText(L2, cx, ch*.68);
    }

    function draw(t){
      if (!src) return;
      ctx.clearRect(0,0,W,H);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      var step = Math.max(1, Math.round(dpr)), cols = [], prev = null, ys = [];
      function off(u){
        var amp = ch*(0.012 + 0.17*Math.pow(u,1.2));
        return amp*Math.sin(u*7.2 - t*3.0) + amp*0.3*Math.sin(u*14 - t*5.2 + 1.3) + ch*0.05*u*u;
      }
      for (var sx=0; sx<L; sx+=step){
        var u = sx/L, y = off(u);
        ctx.drawImage(src, sx,0,step,ch, x0+sx, cy-ch/2+y, step, ch);
        ys.push(y);
      }
      ctx.globalCompositeOperation = 'source-atop';              // bayangan lipatan kain
      for (var i=0, sx2=0; i<ys.length-1; i++, sx2+=step){
        var sl = (ys[i+1]-ys[i])/step;
        ctx.fillStyle = sl > 0 ? 'rgba(0,0,0,'+Math.min(.34, sl*.9)+')' : 'rgba(255,255,255,'+Math.min(.26, -sl*.7)+')';
        ctx.fillRect(x0+sx2, 0, step, H);
      }
      ctx.globalCompositeOperation = 'source-over';
      // tali penarik dari jip ke dua mata ayam
      var hx = Math.max(2, ch*.05), hy = cy + ch*.02;
      var ax = x0 + ch*.3/2, ay1 = cy - ch/2 + ch*.16 + off(ch*.15/L), ay2 = cy - ch/2 + ch*.84 + off(ch*.15/L);
      ctx.strokeStyle = '#5b4a38'; ctx.lineWidth = Math.max(1.5*dpr, ch*.022); ctx.lineCap = 'round';
      [ay1, ay2].forEach(function(ay, k){
        var sag = ch*.05*Math.sin(t*2.2 + k*1.7);
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.quadraticCurveTo((hx+ax)/2, (hy+ay)/2 + sag, ax, ay); ctx.stroke();
      });
      ctx.fillStyle = '#2a2d31'; ctx.beginPath(); ctx.arc(hx, hy, ch*.045, 0, 7); ctx.fill();
    }

    function loop(ts){ raf = 0; if (!visible) return; draw(ts/1000); raf = requestAnimationFrame(loop); }
    function start(){ if (reduce) { draw(1.2); return; } if (!raf && visible) raf = requestAnimationFrame(loop); }

    build(); start();
    if ('ResizeObserver' in window) new ResizeObserver(function(){ build(); start(); if (reduce) draw(1.2); }).observe(cv);
    var scene = cv.closest('.jeep-scene') || cv;
    if ('IntersectionObserver' in window) new IntersectionObserver(function(e){
      visible = e[0].isIntersecting; if (visible) start();
    }).observe(scene);
  });
})();
</script>
